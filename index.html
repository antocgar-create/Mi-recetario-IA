<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mi recetario IA</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2E3D34" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    background: #2E3D34;
    color: #F5F1E6;
    min-height: 100vh;
  }
  .handwritten { font-family: 'Caveat', cursive; }
  header { padding: 28px 20px 20px; border-bottom: 2px dashed rgba(245,241,230,0.2); }
  header h1 { margin: 0; font-size: 40px; color: #E8B84B; line-height: 1; }
  header p { margin: 6px 0 0; font-size: 13px; color: #A8B5AC; }

  .search-wrap { padding: 16px 20px 0; position: relative; }
  .search-wrap input {
    width: 100%; background: #25322B; border: 1px solid #4A5C50; border-radius: 8px;
    padding: 10px 14px 10px 36px; font-size: 16px; color: #F5F1E6;
  }
  .search-icon { position: absolute; left: 32px; top: 27px; color: #7C8A80; font-size: 14px; }

  .tabs { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 20px 0; }
  .tab-btn {
    font-family: 'Caveat', cursive; font-weight: 700; font-size: 20px;
    padding: 4px 16px; border-radius: 6px 6px 0 0; border: 1px solid #4A5C50; border-bottom: none;
    background: #25322B; color: #E8B84B; cursor: pointer;
  }
  .tab-btn.active { background: #E8B84B; color: #2E3D34; }

  .add-btn {
    margin: 16px 20px 0; width: calc(100% - 40px);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: #E2725B; color: #2E3D34; border: none; border-radius: 8px;
    padding: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
  }

  .backup-row { display: flex; gap: 8px; padding: 10px 20px 0; }
  .backup-btn {
    flex: 1; background: #25322B; border: 1px solid #4A5C50; color: #A8B5AC;
    border-radius: 8px; padding: 9px; font-size: 13px; font-weight: 500; cursor: pointer;
  }

  .list { padding: 18px 20px 40px; display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: #25322B; border: 1px solid #4A5C50; border-left: 4px solid #E8B84B;
    border-radius: 8px; padding: 14px 16px; cursor: pointer;
  }
  .card-row { display: flex; justify-content: space-between; align-items: center; }
  .card h3 { font-family: 'Caveat', cursive; font-size: 30px; margin: 0; line-height: 1.1; }
  .card .meta { font-size: 14px; color: #A8B5AC; margin-top: 2px; }
  .chev { color: #7C8A80; transition: transform 0.15s ease; font-size: 14px; }
  .chev.open { transform: rotate(180deg); }

  .card-body { margin-top: 12px; padding-top: 12px; border-top: 2px dashed rgba(245,241,230,0.25); display: none; }
  .card-body.open { display: block; }
  .card-body .label { font-size: 12px; font-weight: 600; color: #E8B84B; margin-bottom: 4px; }
  .card-body p { font-size: 18px; color: #DCE3DE; white-space: pre-wrap; margin: 0 0 12px; }
  .recipe-list { margin: 0 0 14px; padding-left: 20px; }
  .recipe-list li { font-size: 18px; color: #DCE3DE; margin-bottom: 8px; line-height: 1.4; }

  .ingredient-list { list-style: none; margin: 0 0 14px; padding-left: 0; }
  .ingredient-list li {
    font-size: 18px; color: #DCE3DE; margin-bottom: 8px; line-height: 1.4;
    padding-left: 24px; position: relative;
  }
  .ingredient-list li::before {
    content: "✓"; position: absolute; left: 0; color: #E8B84B; font-weight: 700;
  }

  .step-list { margin: 0 0 14px; padding-left: 0; counter-reset: step-counter; list-style: none; }
  .step-list li {
    font-size: 18px; color: #DCE3DE; margin-bottom: 10px; line-height: 1.4;
    padding-left: 32px; position: relative; counter-increment: step-counter;
  }
  .step-list li::before {
    content: counter(step-counter); position: absolute; left: 0; top: 0;
    width: 22px; height: 22px; border-radius: 50%; background: #E2725B; color: #2E3D34;
    font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .del-btn { background: none; border: none; color: #E2725B; font-size: 13px; cursor: pointer; padding: 0; }

  .empty { text-align: center; padding-top: 56px; }
  .empty p { font-family: 'Caveat', cursive; font-size: 24px; color: #A8B5AC; }

  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: flex-end; justify-content: center; z-index: 20; }
  .modal-bg.open { display: flex; }
  .modal { background: #25322B; width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 20px; border-top: 2px solid #E8B84B; max-height: 85vh; overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-header h2 { font-family: 'Caveat', cursive; font-size: 26px; margin: 0; color: #E8B84B; }
  .modal-header button { background: none; border: none; color: #7C8A80; font-size: 18px; cursor: pointer; }
  .modal input, .modal textarea, .modal select {
    width: 100%; background: #1E2822; border: 1px solid #4A5C50; border-radius: 8px;
    padding: 10px 12px; font-size: 16px; color: #F5F1E6; margin-bottom: 10px; resize: none;
    font-family: inherit;
  }
  .save-btn { width: 100%; background: #E8B84B; border: none; border-radius: 8px; padding: 12px; font-size: 16px; font-weight: 600; color: #2E3D34; cursor: pointer; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #4A5C50; color: #F5F1E6; font-size: 13px; padding: 8px 16px; border-radius: 999px; border: 1px solid #5C6E63; z-index: 30; display: none; }
  .toast.show { display: block; }
</style>
</head>
<body>

<header>
  <h1>Mi recetario IA</h1>
  <p id="count">0 recetas guardadas</p>
</header>

<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input id="searchInput" placeholder="Busca una receta por nombre..." />
</div>

<div class="tabs" id="tabs"></div>

<button class="add-btn" id="openAdd">＋ Añadir receta</button>

<div class="backup-row">
  <button class="backup-btn" id="exportBtn">⬇ Exportar copia</button>
  <button class="backup-btn" id="importBtn">⬆ Importar copia</button>
  <input type="file" id="importFile" accept="application/json" style="display:none;" />
</div>

<div class="list" id="list"></div>

<div class="modal-bg" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Nueva receta</h2>
      <button id="closeAdd">✕</button>
    </div>
    <input id="fTitle" placeholder="Nombre de la receta" />
    <select id="fCategorySelect"><option value="">Elige una categoría existente...</option></select>
    <input id="fNewCategory" placeholder="...o escribe una categoría nueva" />
    <textarea id="fIngredients" rows="3" placeholder="Ingredientes (uno por línea)"></textarea>
    <textarea id="fSteps" rows="4" placeholder="Pasos de la preparación"></textarea>
    <textarea id="fNotes" rows="2" placeholder="Notas (opcional)"></textarea>
    <button class="save-btn" id="saveBtn">Guardar receta</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'recetario_recipes';
function loadRecipes() {
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }
  catch (e) { return []; }
}
function saveRecipes(list) { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }

let recipes = loadRecipes();
let activeCategory = 'Todas';
let openId = null;

const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const tabsEl = document.getElementById('tabs');
const searchInput = document.getElementById('searchInput');
const toastEl = document.getElementById('toast');

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2200);
}
function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function renderIngredientsList(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length <= 1) return `<p>${escapeHtml(text)}</p>`;
  return `<ul class="ingredient-list">${lines.map(l => `<li>${escapeHtml(l)}</li>`).join('')}</ul>`;
}
function renderStepsList(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length <= 1) return `<p>${escapeHtml(text)}</p>`;
  return `<ol class="step-list">${lines.map(l => `<li>${escapeHtml(l)}</li>`).join('')}</ol>`;
}
function getCategories() {
  return Array.from(new Set(recipes.map(r => r.category).filter(Boolean))).sort();
}

function renderTabs() {
  const cats = getCategories();
  let html = `<button class="tab-btn ${activeCategory==='Todas'?'active':''}" data-cat="Todas">Todas</button>`;
  cats.forEach(c => {
    html += `<button class="tab-btn ${activeCategory===c?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`;
  });
  tabsEl.innerHTML = html;
  tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => { activeCategory = btn.dataset.cat; render(); });
  });
}

function renderCategorySelect() {
  const sel = document.getElementById('fCategorySelect');
  const cats = getCategories();
  sel.innerHTML = '<option value="">Elige una categoría existente...</option>' +
    cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
}

function render() {
  countEl.textContent = recipes.length + (recipes.length === 1 ? ' receta guardada' : ' recetas guardadas');
  renderTabs();

  let list = recipes;
  if (activeCategory !== 'Todas') list = list.filter(r => r.category === activeCategory);
  const q = searchInput.value.trim().toLowerCase();
  if (q) list = list.filter(r => r.title.toLowerCase().includes(q));

  if (list.length === 0) {
    listEl.innerHTML = `<div class="empty"><p>${recipes.length===0 ? 'Tu recetario está vacío. Añade tu primera receta.' : 'No hay recetas que coincidan.'}</p></div>`;
    return;
  }

  listEl.innerHTML = list.map(r => `
    <div class="card" data-id="${r.id}">
      <div class="card-row">
        <div>
          <h3>${escapeHtml(r.title)}</h3>
          <div class="meta">${escapeHtml(r.category)} · ${r.date}</div>
        </div>
        <span class="chev ${openId===r.id?'open':''}">▾</span>
      </div>
      <div class="card-body ${openId===r.id?'open':''}">
        ${r.ingredients ? `<div class="label">INGREDIENTES</div>${renderIngredientsList(r.ingredients)}` : ''}
        ${r.steps ? `<div class="label">PASOS</div>${renderStepsList(r.steps)}` : ''}
        ${r.notes ? `<div class="label">NOTAS</div><p>${escapeHtml(r.notes)}</p>` : ''}
        <button class="del-btn" data-del="${r.id}">🗑 Eliminar receta</button>
      </div>
    </div>
  `).join('');

  listEl.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('.del-btn')) return;
      const id = card.dataset.id;
      openId = openId === id ? null : id;
      render();
    });
  });
  listEl.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      recipes = recipes.filter(r => r.id !== btn.dataset.del);
      saveRecipes(recipes);
      openId = null;
      render();
      showToast('Receta eliminada');
    });
  });
}

searchInput.addEventListener('input', render);

const addModal = document.getElementById('addModal');
document.getElementById('openAdd').onclick = () => { renderCategorySelect(); addModal.classList.add('open'); };
document.getElementById('closeAdd').onclick = () => { addModal.classList.remove('open'); };

document.getElementById('saveBtn').onclick = () => {
  const title = document.getElementById('fTitle').value.trim();
  const catSelect = document.getElementById('fCategorySelect').value.trim();
  const catNew = document.getElementById('fNewCategory').value.trim();
  const ingredients = document.getElementById('fIngredients').value.trim();
  const steps = document.getElementById('fSteps').value.trim();
  const notes = document.getElementById('fNotes').value.trim();

  if (!title) { showToast('Ponle un nombre a la receta'); return; }
  const category = catNew || catSelect || 'Sin categoría';

  recipes.unshift({
    id: Date.now() + Math.random().toString(36).slice(2,7),
    title, category, ingredients, steps, notes,
    date: new Date().toISOString().slice(0,10)
  });
  saveRecipes(recipes);
  showToast('Receta guardada');

  document.getElementById('fTitle').value = '';
  document.getElementById('fCategorySelect').value = '';
  document.getElementById('fNewCategory').value = '';
  document.getElementById('fIngredients').value = '';
  document.getElementById('fSteps').value = '';
  document.getElementById('fNotes').value = '';
  addModal.classList.remove('open');
  render();
};

render();

document.getElementById('exportBtn').onclick = () => {
  const dataStr = JSON.stringify(recipes, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `mi-recetario-copia-${today}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Copia descargada');
};

const importFileInput = document.getElementById('importFile');
document.getElementById('importBtn').onclick = () => { importFileInput.click(); };
importFileInput.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!Array.isArray(imported)) throw new Error('formato inválido');
      let added = 0, dupes = 0;
      imported.forEach(r => {
        if (!r.title) return;
        const exists = recipes.some(existing =>
          existing.title.trim().toLowerCase() === String(r.title).trim().toLowerCase() &&
          (existing.category||'').trim().toLowerCase() === (r.category||'').trim().toLowerCase()
        );
        if (exists) { dupes++; return; }
        recipes.unshift({
          id: r.id || (Date.now() + Math.random().toString(36).slice(2,7)),
          title: r.title,
          category: r.category || 'Sin categoría',
          ingredients: r.ingredients || '',
          steps: r.steps || '',
          notes: r.notes || '',
          date: r.date || new Date().toISOString().slice(0,10)
        });
        added++;
      });
      saveRecipes(recipes);
      render();
      showToast(`${added} restauradas${dupes ? ', ' + dupes + ' ya existían' : ''}`);
    } catch (err) {
      showToast('El archivo no es una copia válida');
    }
    importFileInput.value = '';
  };
  reader.readAsText(file);
};
</script>
</body>
</html>
